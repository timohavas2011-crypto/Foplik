<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Foplik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 0, 139, 0.3) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
            color: white;
        }

        .main {
            text-align: center;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .Foplik {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 72px;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff0000, #ff6b6b, #ff0000);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 3s ease infinite;
            letter-spacing: 2px;
            text-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .Pfopl {
            font-size: 22px;
            margin-bottom: 50px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .social-link {
            position: relative;
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-link:hover {
            transform: translateY(-10px);
        }

        .fopl_img {
            width: 140px;
            height: 140px;
            border-radius: 25px;
            object-fit: cover;
            border: 3px solid transparent;
            background: linear-gradient(45deg, #8B0000, #B22222, #8B0000) border-box;
            transition: all 0.4s ease;
            box-shadow:
                0 10px 25px rgba(139, 0, 0, 0.4),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            filter: saturate(1.1) contrast(1.05);
        }

        .social-link:hover .fopl_img {
            filter: brightness(0.7) saturate(1.3);
            box-shadow:
                0 15px 35px rgba(139, 0, 0, 0.6),
                0 0 40px rgba(255, 0, 0, 0.4),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            border-width: 5px;
        }

        .social-link::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 0, 0, 0.9);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;

            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-link:hover::after {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .Foplik { font-size: 50px; }
            .Pfopl { font-size: 18px; margin-bottom: 40px; }
            .fopl_img { width: 120px; height: 120px; }
            .links { gap: 25px; }
            .main { padding: 40px 25px; }
        }

        @media (max-width: 480px) {
            .Foplik { font-size: 40px; }
            .links { gap: 20px; }
            .fopl_img { width: 100px; height: 100px; }
        }

        .games-btn {
            display: inline-block;
            background: linear-gradient(45deg, #8B0000, #B22222);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(139, 0, 0, 0.4);
        }

        .games-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(139, 0, 0, 0.6);
        }

        .Games {
            margin-top: 80px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(139, 0, 0, 0.3);
        }

    </style>
</head>
<body>
    <div class="main">
        <h1 class="Foplik">Foplik</h1>
        <p class="Pfopl">Вся информация о Фоплике</p>

        <div class="links">
            <a href="https://t.me/foplikfomk" target="_blank" class="social-link" data-tooltip="Telegram">
                <img src="photoes/foplikTG.jpg" alt="Telegram" class="fopl_img">
            </a>
            <a href="https://www.tiktok.com/@foplikfomk" target="_blank" class="social-link" data-tooltip="TikTok">
                <img src="photoes/foplikTT.jpg" alt="Tiktok" class="fopl_img">
            </a>
            <a href="https://www.youtube.com/@Foplikfomk" target="_blank" class="social-link" data-tooltip="YouTube">
                <img src="photoes/foplikYT.jpg" alt="Youtube" class="fopl_img">
            </a>
            <a href="#games" class="games-btn"> игры фоплика </a>
        </div>

        <div class="Games" id="games">
            ЗДЕСЬ БУДУТ ИГРЫ ФОПЛИКА
        </div>
    </div>
</body>
</html>
